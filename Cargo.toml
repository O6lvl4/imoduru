[package]
name = "imoduru"
version = "0.5.0"
edition = "2021"
description = "Recursive web crawler — pull everything like a sweet potato vine. Rust + Playwright."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.34", features = ["bundled"] }
strsim = "0.11"
rand = "0.9"
pdf-extract = "0.10.0"
base64 = "0.22"
